<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestor de Créditos Compartido</title>
  <style>
    :root{--azul:#243b78;--azul2:#3156c9;--rosa:#f72585;--fondo:#eef2f7;--borde:#d5dce6;--texto:#1f2937;--rojo:#b42318;--verde:#067647}
    *{box-sizing:border-box}body{margin:0;background:var(--fondo);font-family:Arial,sans-serif;color:var(--texto)}
    .wrap{max-width:1450px;margin:24px auto;padding:0 18px}.card{background:#fff;border-radius:14px;box-shadow:0 8px 28px #1d29390f;padding:24px}
    header{text-align:center;margin-bottom:22px}.logo{max-width:220px;max-height:70px}h1{margin:10px 0 4px}h2{margin-top:0}.muted{color:#667085;font-size:14px}
    .login{max-width:430px;margin:55px auto}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:6px}
    input,button{font:inherit;border-radius:8px;padding:11px 12px}input{width:100%;border:1px solid var(--borde)}button{border:0;background:var(--azul2);color:#fff;cursor:pointer;font-weight:700}button:hover{filter:brightness(.94)}button:disabled{opacity:.55;cursor:not-allowed}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.bar input{flex:1;min-width:240px}.secondary{background:#667085}.pink{background:var(--rosa)}.danger{background:var(--rojo)}
    .tabs{display:flex;gap:8px;border-bottom:1px solid var(--borde);margin-bottom:20px}.tab{background:#e9edf5;color:#344054;border-radius:8px 8px 0 0}.tab.active{background:var(--azul2);color:#fff}.panel{display:none}.panel.active{display:block}
    .notice{display:none;padding:12px;border-radius:8px;margin:12px 0}.notice.ok{display:block;background:#dcfae6;color:var(--verde)}.notice.err{display:block;background:#fee4e2;color:var(--rojo)}.notice.info{display:block;background:#e0f2fe;color:#075985}
    .tablebox{overflow:auto;border:1px solid var(--borde);border-radius:8px}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:11px;border-bottom:1px solid var(--borde);text-align:left;white-space:nowrap}th{background:#eef2f6;position:sticky;top:0}tr:hover{background:#f8fafc}
    .copy{background:var(--rosa);padding:7px 11px;font-size:13px}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}.hidden{display:none!important}
    .uploadbox{border:2px dashed var(--borde);padding:20px;border-radius:10px}.status{padding:10px;background:#f8fafc;border-radius:8px;margin-bottom:12px}
    @media(max-width:650px){.wrap{margin:8px auto;padding:8px}.card{padding:15px}.pager{flex-wrap:wrap}.pager button{flex:1}}
  </style>
</head>
<body>
<main class="wrap">
  <section id="loginView" class="card login">
    <header><img src="images/logo.png" class="logo" alt="Tonantel" onerror="this.style.display='none'"><h1>Gestor de Créditos</h1><div class="muted">Cartera compartida</div></header>
    <div class="field"><label for="accessKey">Contraseña de consulta</label><input id="accessKey" type="password" autocomplete="current-password" placeholder="Ingrese la contraseña"></div>
    <button id="loginBtn" style="width:100%">Ingresar</button><div id="loginMsg" class="notice"></div>
  </section>

  <section id="appView" class="card hidden">
    <header><img src="images/logo.png" class="logo" alt="Tonantel" onerror="this.style.display='none'"><h1>Gestor de Créditos</h1><div id="lastUpdate" class="muted">Consultando actualización…</div></header>
    <div class="tabs"><button class="tab active" data-panel="searchPanel">Buscar asociado</button><button class="tab" data-panel="uploadPanel">Administrar cartera</button><button id="logoutBtn" class="secondary" style="margin-left:auto">Salir</button></div>
    <section id="searchPanel" class="panel active">
      <div class="bar"><input id="searchInput" placeholder="Buscar por nombre, crédito o cliente…"><button id="searchBtn">Buscar</button><button id="allBtn" class="secondary">Mostrar todos</button></div>
      <div id="searchMsg" class="notice"></div><div id="count" class="muted" style="margin:10px 0"></div>
      <div class="tablebox"><table><thead><tr><th>CLIENTE</th><th>NOMBRE</th><th>CRÉDITO</th><th>MONTO ORIGINAL</th><th>SALDO ACTUAL</th><th>USUARIO</th><th>FECHA DE PAGO</th><th>ACCIÓN</th></tr></thead><tbody id="tbody"></tbody></table></div>
      <div class="pager"><button id="prevBtn" class="secondary">Anterior</button><span id="pageInfo"></span><button id="nextBtn" class="secondary">Siguiente</button></div>
    </section>
    <section id="uploadPanel" class="panel">
      <div class="uploadbox"><h2>Cargar nueva cartera</h2><p class="muted">La nueva carga reemplazará completamente la cartera anterior. Se conserva toda la información de cada fila.</p>
        <div class="field"><label for="adminKey">Clave administrativa</label><input id="adminKey" type="password" autocomplete="off"></div>
        <div class="field"><label for="excelFile">Archivo Excel</label><input id="excelFile" type="file" accept=".xlsx,.xls,.xlsb"></div>
        <button id="uploadBtn">Procesar y reemplazar cartera</button><div id="uploadMsg" class="notice"></div>
      </div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  // 1) Cree su proyecto en Supabase. 2) Pegue aquí Project URL y anon public key.
  const SUPABASE_URL = 'https://ajcuuizsvsanxpxpnmdh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6guWHhdjDG3i-BFGx0JfQQ_BUSDteUA';
  const PAGE_SIZE = 50;

  const $ = id => document.getElementById(id);
  let db = null, accessKey = '', page = 0, total = 0, currentSearch = '';
  const required = ['CLIENTE','NOMBRE','CREDITO','MONTO ORIGINAL','SALDO ACTUAL','USUARIO','FECHA DE PAGO'];

  function message(id,text,type='info'){const el=$(id);el.textContent=text;el.className='notice '+type}
  function hideMessage(id){$(id).className='notice'}
  function configured(){return SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('PEGUE_') && !SUPABASE_ANON_KEY.includes('PEGUE_')}
  function client(headers={}){return supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{headers}})}
  function clean(v){return v===undefined||v===null?'':String(v).trim()}
  function money(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('es-GT',{style:'currency',currency:'GTQ'}).format(n).replace('GTQ','Q'):''}
  function creditFormat(v){const s=clean(v).replace(/[\s-]/g,'');return /^\d{14}$/.test(s)?`${s.slice(0,3)}-${s.slice(3,7)}-${s.slice(7,11)}-${s.slice(11)}`:clean(v)}
  function excelDate(v){if(typeof v==='number'&&v>20000){const d=XLSX.SSF.parse_date_code(v);return d?`${String(d.d).padStart(2,'0')}/${String(d.m).padStart(2,'0')}/${d.y}`:clean(v)}return clean(v)}
  function normalizeHeader(h){return clean(h).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ')}
  function escapeLike(v){return v.replace(/[%,]/g,' ').trim()}

  async function login(){
    hideMessage('loginMsg'); accessKey=$('accessKey').value.trim();
    if(!configured()) return message('loginMsg','Primero debe configurar la conexión con Supabase dentro del archivo index.html.','err');
    if(!accessKey) return message('loginMsg','Ingrese la contraseña de consulta.','err');
    $('loginBtn').disabled=true; db=client({'x-clave-gestor':accessKey});
    const {data,error}=await db.from('estado_cartera').select('*').eq('id',1).maybeSingle();
    $('loginBtn').disabled=false;
    if(error||!data){db=null;return message('loginMsg','Contraseña incorrecta o no fue posible conectar.','err')}
    sessionStorage.setItem('gestorKey',accessKey); $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
    setStatus(data); await loadRows();
  }

  function setStatus(s){$('lastUpdate').textContent=s&&s.actualizado_at?`Última actualización: ${new Date(s.actualizado_at).toLocaleString('es-GT')} · ${s.total_registros} registros · ${s.archivo||''}`:'Sin cartera cargada'}
  async function refreshStatus(){const {data}=await db.from('estado_cartera').select('*').eq('id',1).maybeSingle();if(data)setStatus(data)}

  async function loadRows(){
    $('tbody').innerHTML='<tr><td colspan="8">Cargando…</td></tr>'; hideMessage('searchMsg');
    const from=page*PAGE_SIZE,to=from+PAGE_SIZE-1; let q=db.from('cartera_creditos').select('cliente,nombre,credito,monto_original,saldo_actual,usuario,fecha_pago',{count:'exact'});
    if(currentSearch){const s=escapeLike(currentSearch);q=q.or(`nombre.ilike.%${s}%,credito.ilike.%${s}%,cliente.ilike.%${s}%`)}
    const {data,error,count}=await q.order('nombre').range(from,to);
    if(error){$('tbody').innerHTML='';return message('searchMsg','No fue posible consultar la cartera. Verifique la conexión.','err')}
    total=count||0; render(data||[]); updatePager();
  }

  function render(rows){
    const body=$('tbody'); body.innerHTML='';
    if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=8;td.textContent='No se encontraron registros';tr.appendChild(td);body.appendChild(tr);return}
    rows.forEach(r=>{const tr=document.createElement('tr');[r.cliente,r.nombre,creditFormat(r.credito),money(r.monto_original),money(r.saldo_actual),r.usuario,r.fecha_pago].forEach(v=>{const td=document.createElement('td');td.textContent=clean(v);tr.appendChild(td)});const td=document.createElement('td'),b=document.createElement('button');b.className='copy';b.textContent='Copiar';b.onclick=()=>copyCredit(b,r.credito,r.nombre);td.appendChild(b);tr.appendChild(td);body.appendChild(tr)})
  }
  async function copyCredit(btn,credito,nombre){const text=`CREDITO ${creditFormat(credito)} ${clean(nombre)}`;try{await navigator.clipboard.writeText(text);btn.textContent='¡Copiado!';setTimeout(()=>btn.textContent='Copiar',1600)}catch{message('searchMsg','No fue posible copiar automáticamente.','err')}}
  function updatePager(){const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));$('count').textContent=`${total} registro${total===1?'':'s'} encontrado${total===1?'':'s'}`;$('pageInfo').textContent=`Página ${page+1} de ${pages}`;$('prevBtn').disabled=page===0;$('nextBtn').disabled=page+1>=pages}

  async function upload(){
    hideMessage('uploadMsg');const file=$('excelFile').files[0],admin=$('adminKey').value.trim();
    if(!admin)return message('uploadMsg','Ingrese la clave administrativa.','err');if(!file)return message('uploadMsg','Seleccione un archivo Excel.','err');
    $('uploadBtn').disabled=true;message('uploadMsg','Procesando archivo…','info');
    try{
      const buffer=await file.arrayBuffer(),wb=XLSX.read(buffer,{type:'array',cellDates:false}),ws=wb.Sheets[wb.SheetNames[0]];
      let rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});if(!rows.length)throw new Error('El archivo no contiene registros.');
      const receivedHeaders=new Set(Object.keys(rows[0]).map(normalizeHeader));
      const missing=required.filter(k=>!receivedHeaders.has(k));if(missing.length)throw new Error('Faltan columnas: '+missing.join(', '));
      rows=rows.map(original=>{const normalized={};Object.entries(original).forEach(([k,v])=>normalized[normalizeHeader(k)]=v);normalized['FECHA DE PAGO']=excelDate(normalized['FECHA DE PAGO']);return normalized});
      if(!confirm(`Se reemplazará la cartera actual con ${rows.length} registros. ¿Desea continuar?`)){ $('uploadBtn').disabled=false;return hideMessage('uploadMsg') }
      const adminDb=client({'x-clave-admin':admin});const {data,error}=await adminDb.rpc('reemplazar_cartera',{p_filas:rows,p_archivo:file.name});if(error)throw error;
      message('uploadMsg',`Cartera actualizada correctamente: ${data} registros.`,`ok`);page=0;currentSearch='';$('searchInput').value='';await refreshStatus();await loadRows();
    }catch(e){message('uploadMsg','No se pudo cargar: '+(e.message||e),'err')}finally{$('uploadBtn').disabled=false}
  }

  $('loginBtn').onclick=login;$('accessKey').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
  $('logoutBtn').onclick=()=>{sessionStorage.removeItem('gestorKey');location.reload()};
  $('searchBtn').onclick=()=>{currentSearch=$('searchInput').value.trim();page=0;loadRows()};
  $('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
  $('allBtn').onclick=()=>{$('searchInput').value='';currentSearch='';page=0;loadRows()};
  $('prevBtn').onclick=()=>{if(page>0){page--;loadRows()}};$('nextBtn').onclick=()=>{if((page+1)*PAGE_SIZE<total){page++;loadRows()}};
  $('uploadBtn').onclick=upload;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.panel).classList.add('active')});
  const saved=sessionStorage.getItem('gestorKey');if(saved){$('accessKey').value=saved;login()}
</script>
</body>
</html>
