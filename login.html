<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Acceso seguro al Gestor de Créditos.">
  <title>Acceso | Gestor de Créditos</title><link rel="stylesheet" href="css/portal.css">
</head>
<body class="auth-page">
  <main class="auth-shell"><section class="auth-card">
    <img src="images/logo.png" alt="Logo" class="brand-logo compact">
    <span class="eyebrow">Acceso seguro</span><h1>Bienvenido</h1>
    <p class="lead small">Ingresa con el usuario y la contraseña asignados.</p>
    <form id="loginForm">
      <label class="field-label" for="username">Usuario</label>
      <input class="text-input" id="username" autocomplete="username" placeholder="administrador o consulta" autocapitalize="none" spellcheck="false" required>
      <label class="field-label" for="password">Contraseña</label>
      <input class="text-input" id="password" type="password" autocomplete="current-password" required>
      <button id="loginBtn" class="button primary large" type="submit">Ingresar</button>
    </form>
    <div id="loginMessage" class="message" role="status" aria-live="polite"></div>
    <footer class="copyright">© 2026 Fgarcia. Todos los derechos reservados.</footer>
  </section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script><script src="js/login.js" defer></script>
</body>
</html>
